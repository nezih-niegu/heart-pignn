[project]
name = "heart-pignn"
version = "0.1.0"
description = "Clasificador de latidos AAMI: PIGNN + reglas de main.py unidas por el latente de atencion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.2",
    "tqdm>=4.70.0",
    "typer>=0.12",
    "wfdb>=4.1",
]

[project.scripts]
heart-pignn = "heart_pignn.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
# El notebook importa cosas que solo usan las celdas de ablacion comentadas
exclude = ["notebooks", ".venv"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
